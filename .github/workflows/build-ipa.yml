name: Build Scrcpy Remote IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: porting/libtsnet/go.sum

      - name: Install build tools
        run: |
          brew install meson ninja nasm ffmpeg sdl2 fmt lz4 brotli zstd
          brew unlink protobuf 2>/dev/null || true
          sudo mkdir -p /usr/local/bin
          sudo curl -fsSL -o /usr/local/bin/gas-preprocessor.pl \
            https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl
          sudo chmod +x /usr/local/bin/gas-preprocessor.pl
          xcodebuild -version

      - name: Fetch submodule tags
        run: git submodule foreach --recursive 'git fetch --tags --force --prune || true'

      - name: Cache porting libs
        id: libcache
        uses: actions/cache@v4
        with:
          path: |
            porting/libs
            scrcpy/x
          key: porting-libs-v2-${{ hashFiles('porting/Makefile', 'porting/scripts/**', 'porting/cmake/**', '.gitmodules') }}

      - name: Prepare libs directories
        run: |
          mkdir -p porting/libs/iphoneos/arm64
          mkdir -p porting/libs/iphonesimulator/arm64
          mkdir -p porting/libs/iphonesimulator/x86_64
          mkdir -p porting/libs/include

      - name: Build and install host protobuf 28.3
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          cd external/adb-mobile/external/protobuf
          git fetch --tags --force
          git checkout v28.3
          git submodule update --init --recursive
          # absl misdetects arch and injects x86-only flags on arm64 macs - strip them
          find third_party/abseil-cpp/absl/copts -name '*.cmake' -exec sed -i '' 's/-msse4\.1//g; s/-maes//g' {} +
          cmake -S . -B out-host -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_ABSL_PROVIDER=module -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_CXX_STANDARD=17
          cmake --build out-host -j 8
          sudo cmake --install out-host
          protoc --version

      - name: Create missing zstd programs stub
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          printf '# Stub for iOS cross build - do not build zstd command-line programs\n' \
            > external/adb-mobile/porting/cmake/CMakeLists.zstd.txt

      - name: Build adb-mobile
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          make -C porting adb-mobile
          if ! nm porting/libs/iphoneos/arm64/libadb-full.a 2>/dev/null | grep -q "T _adb_commandline_porting"; then
            echo "::error::libadb-full.a is missing adb_commandline_porting - adb core build silently failed"
            exit 1
          fi

      - name: Build SDL2
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting libsdl

      - name: Build FFmpeg
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting ffmpeg

      - name: Build libscrcpy
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting scrcpy

      - name: Build OpenSSL
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting openssl

      - name: Build vncclient
        if: steps.libcache.outputs.cache-hit != 'true'
        run: make -C porting vncclient

      - name: Build tsnet-forwarder
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          (cd porting/libtsnet && go mod tidy)
          make -C porting tsnet-forwarder

      - name: Build app (unsigned)
        working-directory: scrcpy-app
        run: |
          xcodebuild \
            -project "Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package IPA
        run: |
          set -x
          APP_PATH=$(find scrcpy-app/build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | grep -i iphoneos | head -1)
          echo "Found app: $APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" || echo "unknown")
          mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry "Scrcpy-Remote-v${VERSION}-unsigned.ipa" Payload
          ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-remote-ipa
          path: out/*.ipa
          if-no-files-found: error
